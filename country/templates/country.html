<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="text-center text-dark">List of Countries</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="GET" action="{% url 'country_list' %}" class="d-flex">
                    <input type="text" name="q" class="form-control me-2" placeholder="Search for a country..." value="{{ search_query }}">
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
        <div class="row mt-4">
            {% for country in countries %}
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">{{ country.name }}</h5>
                        <p class="card-text"><strong>Alpha2 Code:</strong> {{ country.alpha2_code }}</p>
                        <p class="card-text"><strong>Alpha3 Code:</strong> {{ country.alpha3_code }}</p>
                        <p class="card-text text-danger"><strong>Region:</strong> {{ country.region }}</p>
                        <p class="card-text text-success"><strong>Capital:</strong> {{ country.capital }}</p>
                        <a href="{% url 'country_details' country.id %}" class="btn btn-info">Details</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">No countries found</p>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
